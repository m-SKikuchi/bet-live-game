<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>忘年会ダービー - 参加者</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <b>忘年会ダービー</b>
  <span id="connection">接続中...</span>
</header>

<main>
  <div id="bettingCountdown" class="betting-countdown hidden" aria-live="assertive">
    <span class="countdown-label">BET締切まで</span>
    <strong id="bettingCountdownValue">10</strong>
    <span class="countdown-unit">秒</span>
  </div>
  <div id="showOverlay" class="show-overlay hidden" aria-live="assertive" role="status">
    <div class="show-overlay-rays"></div>
    <div class="show-overlay-content">
      <span id="showOverlayKicker" class="show-overlay-kicker">SPECIAL</span>
      <strong id="showOverlayTitle" class="show-overlay-title">DERBY START!</strong>
      <span id="showOverlaySubtitle" class="show-overlay-subtitle"></span>
      <div id="showOverlayDetails" class="show-overlay-details"></div>
    </div>
    <div class="show-overlay-confetti" aria-hidden="true">★ ✦ ★ ✦ ★</div>
  </div>
  <section id="login" class="card">
    <h1>参加・再ログイン</h1>
    <p class="help">
      初回参加時は参加者番号を空欄にしてください。
      再ログイン時は発行済み番号と登録時の名前を入力します。
    </p>

    <label for="participantNumber">参加者番号</label>
    <input id="participantNumber" inputmode="numeric" autocomplete="off" placeholder="初回参加時は空欄">

    <label for="name">名前</label>
    <input id="name" maxlength="24" autocomplete="name" placeholder="名前">

    <label for="roomCode">ルームID</label>
    <input id="roomCode" maxlength="6" autocomplete="off" placeholder="6文字のルームID">

    <button id="joinBtn" type="button">参加する</button>
    <p id="loginMessage" class="message" aria-live="polite"></p>
  </section>

  <section id="game" class="hidden">
    <div id="gameMainCard" class="card">
      <div class="row">
        <h2 id="status"></h2>
        <b id="balance"></b>
      </div>

      <strong id="assignedNumber"></strong>
      <p id="meta"></p>

      <div id="carryoverBanner" class="carryover-banner hidden"></div>

      <section id="questionArea">
        <h2 id="question">問題を読み込み中...</h2>
        <ol id="questionChoices"></ol>
      </section>

      <div id="choicesBox" class="choices"></div>

      <label for="amount">ベット点数 <span id="betLimitHelp" class="help"></span></label>
      <div class="number-stepper">
        <button id="amountDown10" class="secondary" type="button">−10</button>
        <button id="amountDown5" class="secondary" type="button">−5</button>
        <input id="amount" type="number" inputmode="numeric" min="1" step="1" value="10">
        <button id="amountUp5" class="secondary" type="button">＋5</button>
        <button id="amountUp10" class="secondary" type="button">＋10</button>
      </div>

      <button id="betBtn" type="button">ベットする</button>
      <p id="message" class="message" aria-live="polite"></p>
    </div>

    <section id="finalWaiting" class="card final-stage hidden" aria-live="polite">
      <div class="final-stage-kicker">BET LIVE / FINAL</div>
      <h1>🏆 最終結果発表まで</h1>
      <p class="final-waiting-message">もうしばらくお待ちください！</p>
      <div class="final-waiting-pulse"><span></span><span></span><span></span></div>
      <p>外部での優勝者発表をお楽しみください。</p>
    </section>
    <section id="finalResults" class="card final-results hidden">
      <div class="final-stage-kicker">BET LIVE / FINAL RESULTS</div>
      <h1>🏆 最終結果</h1>
      <div id="myFinalStanding" class="my-final-standing"></div>
      <h2>全体ランキング</h2>
      <ol id="finalRanking" class="final-ranking"></ol>
    </section>
    <button id="showLoginBtn" class="secondary" type="button">ログイン画面へ戻る</button>
  </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script src="/app.js"></script>
</body>
</html>
